<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canais ao Vivo — HANS_CINE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:       #0a0a0f;
            --surface:  #111118;
            --card:     #16161f;
            --border:   rgba(255,255,255,0.07);
            --red:      #e50914;
            --red-glow: rgba(229,9,20,0.3);
            --text:     #f0f0f0;
            --muted:    #888;
            --dim:      #444;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            overflow-x: hidden;
        }

        /* ═══ HEADER ═══ */
        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 72px;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            background: rgba(10,10,15,0.97);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(20px);
        }
        .logo {
            font-family: 'Bebas Neue', cursive;
            font-size: 2rem;
            letter-spacing: 3px;
            color: var(--red);
            text-shadow: 0 0 30px var(--red-glow);
            user-select: none;
        }
        nav { display: flex; gap: 4px; }
        nav a {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 500;
            padding: 7px 16px;
            border-radius: 100px;
            transition: all 0.2s;
        }
        nav a:hover { color: var(--text); background: rgba(255,255,255,0.06); }
        nav a.active { color: var(--text); font-weight: 600; }

        /* ═══ LIVE BANNER ═══ */
        .live-banner {
            margin-top: 72px;
            height: 160px;
            background: linear-gradient(135deg, #0f0015 0%, #130008 50%, #0a0a0f 100%);
            display: flex;
            align-items: center;
            padding: 0 50px;
            gap: 24px;
            border-bottom: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }
        .live-banner::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 20% 50%, rgba(229,9,20,0.12), transparent 60%);
        }
        .live-dot {
            width: 14px; height: 14px;
            background: var(--red);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--red);
            animation: pulse 1.5s infinite;
            flex-shrink: 0;
        }
        @keyframes pulse { 0%,100%{opacity:1;box-shadow:0 0 10px var(--red);} 50%{opacity:0.6;box-shadow:0 0 25px var(--red);} }

        .live-text { position: relative; }
        .live-text h1 {
            font-family: 'Bebas Neue', cursive;
            font-size: 2.8rem;
            letter-spacing: 3px;
            color: var(--text);
            line-height: 1;
        }
        .live-text p {
            color: var(--muted);
            font-size: 0.9rem;
            margin-top: 6px;
            font-weight: 300;
        }

        /* ═══ CATEGORIES BAR ═══ */
        .categories-bar {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            padding: 16px 40px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            scrollbar-width: none;
            scroll-behavior: smooth;
            position: sticky;
            top: 72px;
            z-index: 50;
        }
        .categories-bar::-webkit-scrollbar { display: none; }

        .cat-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 8px 20px;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 500;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .cat-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); }
        .cat-btn.active {
            background: var(--red);
            border-color: var(--red);
            color: white;
            font-weight: 600;
            box-shadow: 0 4px 14px var(--red-glow);
        }

        /* ═══ MAIN CONTENT ═══ */
        .live-main { padding: 40px; }

        .section-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 30px;
        }
        #titulo-categoria {
            font-family: 'Bebas Neue', cursive;
            font-size: 1.8rem;
            letter-spacing: 2px;
            font-weight: 400;
        }
        .section-line { flex: 1; height: 1px; background: linear-gradient(to right, var(--border), transparent); }

        /* ═══ CANAL GRID ═══ */
        .canais-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .canal-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .canal-card .poster-canal {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: contain;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .canal-card:hover .poster-canal {
            border-color: var(--red);
            box-shadow: 0 0 25px var(--red-glow), 0 8px 25px rgba(0,0,0,0.5);
            transform: translateY(-4px) scale(1.02);
        }
        .canal-nome {
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--muted);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            transition: color 0.2s;
        }
        .canal-card:hover .canal-nome { color: var(--text); }

        .loading-msg { color: var(--muted); font-size: 0.9rem; padding: 20px 0; }

        /* ═══ PLAYER MODAL ═══ */
        #player-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.96);
            z-index: 200;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(20px);
        }
        .close-btn {
            position: fixed;
            top: 20px; right: 30px;
            width: 44px; height: 44px;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--border);
            color: white;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            z-index: 201;
            transition: all 0.2s;
        }
        .close-btn:hover { background: var(--red); border-color: var(--red); transform: scale(1.1); }
        #PlayerContainer {
            width: 90%;
            height: 80%;
            background: #000;
            border-radius: 12px;
            box-shadow: 0 0 0 1px var(--border), 0 40px 80px rgba(0,0,0,0.9);
            overflow: hidden;
        }

        /* ═══ FULLSCREEN BUTTON (injetado pelo JS) ═══ */
        #btn-tela-cheia {
            position: fixed !important;
            top: 20px !important;
            right: 90px !important;
            z-index: 9999 !important;
            background: var(--red) !important;
            color: white !important;
            border: none !important;
            padding: 10px 18px !important;
            border-radius: 8px !important;
            font-size: 0.85rem !important;
            font-weight: 600 !important;
            cursor: pointer !important;
            font-family: 'DM Sans', sans-serif !important;
            box-shadow: 0 4px 14px var(--red-glow) !important;
            transition: transform 0.2s !important;
        }

        /* ═══ RESPONSIVE ═══ */
        @media (max-width: 900px) {
            .live-main { padding: 30px 24px; }
            .canais-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
        }
        @media (max-width: 600px) {
            header { padding: 0 16px; height: 60px; }
            .logo { font-size: 1.6rem; letter-spacing: 2px; }
            nav {
                position: fixed;
                bottom: 0; left: 0; right: 0;
                height: 58px;
                background: rgba(10,10,15,0.98);
                border-top: 1px solid var(--border);
                backdrop-filter: blur(20px);
                display: flex;
                justify-content: space-around;
                align-items: center;
                z-index: 150;
                gap: 0;
            }
            nav a {
                flex: 1;
                text-align: center;
                padding: 10px 4px 6px;
                border-radius: 0;
                font-size: 0.7rem;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 3px;
                color: var(--muted);
            }
            nav a::before { font-size: 1.2rem; line-height: 1; }
            nav a[href="index.html"]::before  { content: '🏠'; }
            nav a[href="aovivo.html"]::before { content: '📡'; }
            nav a[href="filmes.html"]::before { content: '🎬'; }
            nav a.active { color: var(--red); background: transparent; }
            nav a:hover  { background: transparent; }
            body { padding-bottom: 58px; }
            .live-banner { height: 110px; padding: 0 20px; gap: 14px; }
            .live-text h1 { font-size: 2rem; }
            .live-text p  { font-size: 0.78rem; }
            .categories-bar { top: 60px; padding: 12px 14px; gap: 6px; }
            .cat-btn { padding: 6px 14px; font-size: 0.78rem; }
            .live-main { padding: 24px 14px; }
            #titulo-categoria { font-size: 1.3rem; }
            .canais-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
            .canal-nome { font-size: 0.75rem; }
            #player-modal { align-items: flex-start; }
            .close-btn { top: 12px; right: 14px; width: 36px; height: 36px; font-size: 1rem; }
            #PlayerContainer { width: 100%; height: 56vw; border-radius: 0; box-shadow: none; }
            #btn-tela-cheia { top: 12px !important; right: 60px !important; padding: 7px 12px !important; font-size: 0.75rem !important; }
            .dev-footer { padding: 20px 16px; }
            .dev-footer-inner { flex-direction: column; align-items: center; gap: 12px; text-align: center; }
            .dev-links { flex-wrap: wrap; justify-content: center; }
        }
        @media (max-width: 380px) {
            .canais-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
        }
    </style>
</head>
